<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDG — Model View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* Canvas lives here — leaves room for footer */
    #viewer {
      position: absolute;
      top: 0; left: 0; right: 0;
      bottom: 40px;
    }
    #viewer canvas { display: block; }

    /* ── Footer ── */
    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease 0.4s;
    }
    #footer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #hint {
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2C3D2E;
      opacity: 0.4;
      pointer-events: none;
    }

    #reset-btn {
      font-family: inherit;
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 12px;
      border: 1px solid #2C3D2E;
      background: transparent;
      color: #2C3D2E;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.15s;
    }
    #reset-btn:hover { opacity: 1; }

    /* ── Loading ── */
    #loading {
      position: fixed;
      inset: 0 0 40px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #2C3D2E;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #loading.visible { opacity: 0.5; }

    /* ── Dev readout ── */
    #dev-readout {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #2C3D2E;
      background: rgba(242,240,234,0.85);
      padding: 10px 14px;
      line-height: 1.8;
      pointer-events: none;
    }
    #dev-readout.visible { display: block; }
  </style>
</head>
<body>

  <div id="viewer"></div>
  <div id="loading">Loading</div>

  <div id="footer">
    <span id="hint">Drag to orbit &nbsp;&middot;&nbsp; Scroll to zoom &nbsp;&middot;&nbsp; Right-click to pan</span>
    <button id="reset-btn">Reset view</button>
  </div>

  <div id="dev-readout">
    <div>az &nbsp;&nbsp;<span id="dev-az">—</span>°</div>
    <div>el &nbsp;&nbsp;<span id="dev-el">—</span>°</div>
    <div>zoom &nbsp;<span id="dev-zoom">—</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const LINE_COLOR   = 0x2C3D2E;
    const LINE_OPACITY = 0.55;
    const EDGE_ANGLE   = 15;

    /* ── URL params ── */
    const params   = new URLSearchParams(location.search);
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const devMode  = params.get('dev') === '1';

    // Camera params — mobile overrides desktop if on mobile
    function getParam(mobileKey, desktopKey, fallback) {
      if (isMobile && params.has(mobileKey)) return parseFloat(params.get(mobileKey));
      if (params.has(desktopKey))            return parseFloat(params.get(desktopKey));
      return fallback;
    }

    const CAM_AZ   = getParam('maz',  'az',   45);   // degrees, 0=front, 90=right
    const CAM_EL   = getParam('mel',  'el',   30);   // degrees, 0=horizon, 90=top
    const CAM_ZOOM = getParam('mzoom','zoom',  1.0);  // multiplier, >1 = further away

    /* ── Viewer container ── */
    const viewerEl = document.getElementById('viewer');
    function vw() { return viewerEl.clientWidth  || window.innerWidth; }
    function vh() { return viewerEl.clientHeight || (window.innerHeight - 40); }

    /* ── Scene ── */
    const scene = new THREE.Scene();

    /* ── Camera ── */
    const camera = new THREE.PerspectiveCamera(42, vw() / vh(), 0.001, 2000);

    /* ── Renderer ── */
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(vw(), vh());
    renderer.domElement.style.touchAction = 'none'; // hand all touch events to Three.js
    viewerEl.appendChild(renderer.domElement);

    /* ── Controls ── */
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping   = true;
    controls.dampingFactor   = 0.06;
    controls.autoRotate      = false;
    controls.minDistance     = 0.5;
    controls.maxDistance     = 500;

    /* ── Mobile touch — bypass OrbitControls entirely ── */
    if (isMobile) {
      controls.enabled = false;

      const MIN_DIST = 0.5;
      const MAX_DIST = 500;
      let lastX = 0, lastY = 0, lastPinch = 0;

      renderer.domElement.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          lastPinch = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: false });

      renderer.domElement.addEventListener('touchmove', (e) => {
        e.preventDefault();

        if (e.touches.length === 1) {
          // One finger — orbit
          const dx = e.touches[0].clientX - lastX;
          const dy = e.touches[0].clientY - lastY;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;

          const offset = camera.position.clone().sub(controls.target);
          const sph    = new THREE.Spherical().setFromVector3(offset);
          sph.theta -= dx * 0.008;
          sph.phi   -= dy * 0.008;
          sph.phi    = Math.max(0.05, Math.min(Math.PI * 0.95, sph.phi));
          camera.position.copy(
            new THREE.Vector3().setFromSpherical(sph).add(controls.target)
          );
          camera.lookAt(controls.target);

        } else if (e.touches.length === 2) {
          // Two fingers — pinch zoom only
          const dx   = e.touches[0].clientX - e.touches[1].clientX;
          const dy   = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const scale = lastPinch / dist;
          lastPinch = dist;

          const offset = camera.position.clone().sub(controls.target);
          const newLen = Math.max(MIN_DIST, Math.min(MAX_DIST, offset.length() * scale));
          camera.position.copy(
            controls.target.clone().add(offset.normalize().multiplyScalar(newLen))
          );
          camera.lookAt(controls.target);
        }
      }, { passive: false });

      renderer.domElement.addEventListener('touchend', (e) => {
        // Reset single-touch reference when a finger lifts
        if (e.touches.length === 1) {
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
        }
      }, { passive: false });
    }

    /* ── Light ── */
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    /* ── Camera position from az/el/zoom ── */
    let modelScale = 1; // updated after load
    let defaultCamPos = new THREE.Vector3();
    let transitioning = false;
    let camTarget = null;

    function buildCamPos(az, el, zoom, d) {
      const azRad = az * Math.PI / 180;
      const elRad = el * Math.PI / 180;
      const r     = d * 1.4 * zoom;
      return new THREE.Vector3(
        r * Math.cos(elRad) * Math.sin(azRad),
        r * Math.sin(elRad),
        r * Math.cos(elRad) * Math.cos(azRad)
      );
    }

    function resetView() {
      camTarget     = defaultCamPos.clone();
      transitioning = true;
    }

    /* ── Dev readout ── */
    if (devMode) {
      document.getElementById('dev-readout').classList.add('visible');
    }

    function updateDevReadout() {
      if (!devMode) return;
      const rel  = camera.position.clone().sub(controls.target);
      const r    = rel.length();
      const elDeg = (Math.asin(rel.y / r) * 180 / Math.PI).toFixed(1);
      const azDeg = (Math.atan2(rel.x, rel.z) * 180 / Math.PI).toFixed(1);
      const zoom  = (r / (modelScale * 1.4)).toFixed(2);
      document.getElementById('dev-az').textContent   = azDeg;
      document.getElementById('dev-el').textContent   = elDeg;
      document.getElementById('dev-zoom').textContent = zoom;
    }

    /* ── Hint text — desktop vs mobile ── */
    document.getElementById('hint').textContent = isMobile
      ? 'Tap to orbit  ·  Pinch to zoom'
      : 'Drag to orbit  ·  Scroll to zoom  ·  Right-click to pan';

    /* ── Load GLB ── */
    function loadModel(url) {
      document.getElementById('loading').classList.add('visible');

      new THREE.GLTFLoader().load(url, (gltf) => {
        const root = gltf.scene;

        const box    = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size   = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale  = 4 / maxDim;

        root.position.sub(center.multiplyScalar(scale));
        root.scale.setScalar(scale);

        // Pure linework
        root.traverse((child) => {
          if (!child.isMesh) return;

          child.material = new THREE.MeshBasicMaterial({
            colorWrite:          false,
            depthWrite:          true,
            polygonOffset:       true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits:  1
          });
          child.renderOrder = 0;

          const edges = new THREE.EdgesGeometry(child.geometry, EDGE_ANGLE);
          const lines = new THREE.LineSegments(
            edges,
            new THREE.LineBasicMaterial({
              color:       LINE_COLOR,
              transparent: true,
              opacity:     LINE_OPACITY
            })
          );
          lines.renderOrder = 1;
          child.add(lines);
        });

        scene.add(root);

        // Store model scale for dev readout
        const d   = maxDim * scale;
        modelScale = d;

        // Set camera from params
        defaultCamPos = buildCamPos(CAM_AZ, CAM_EL, CAM_ZOOM, d);
        controls.target.set(0, 0, 0);
        camera.position.copy(defaultCamPos);
        controls.update();

        document.getElementById('loading').classList.remove('visible');
        document.getElementById('footer').classList.add('visible');

      }, undefined, (err) => {
        console.error('GLB load error:', err);
        document.getElementById('loading').classList.remove('visible');
      });
    }

    /* ── Auto-load from ?model=URL ── */
    const autoModel = params.get('model');
    if (autoModel) loadModel(autoModel);

    /* ── Reset button ── */
    document.getElementById('reset-btn').addEventListener('click', resetView);

    /* ── Cancel transition on manual orbit ── */
    renderer.domElement.addEventListener('pointerdown', () => {
      transitioning = false;
    });

    /* ── Resize ── */
    window.addEventListener('resize', () => {
      camera.aspect = vw() / vh();
      camera.updateProjectionMatrix();
      renderer.setSize(vw(), vh());
    });

    /* ── Loop ── */
    (function animate() {
      requestAnimationFrame(animate);

      if (transitioning && camTarget) {
        camera.position.lerp(camTarget, 0.08);
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.08);
        if (camera.position.distanceTo(camTarget) < 0.01) {
          camera.position.copy(camTarget);
          transitioning = false;
        }
      }

      controls.update();
      updateDevReadout();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
