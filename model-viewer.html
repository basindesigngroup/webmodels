<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDG — Model View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    #viewer {
      position: absolute;
      top: 0; left: 0; right: 0;
      bottom: 40px;
    }
    #viewer canvas { display: block; }

    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease 0.4s;
    }
    #footer.visible { opacity: 1; pointer-events: auto; }

    #hint {
      font-family: Georgia, 'PT Serif', serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: ;
      color: #2C3D2E;
      opacity: 1;
      pointer-events: none;
    }

    #reset-btn {
      font-family: Georgia, 'PT Serif', serif;
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 12px;
      border: 1px solid #2C3D2E;
      background: transparent;
      color: #2C3D2E;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.15s;
    }
    #reset-btn:hover { opacity: 1; }

    #loading {
      position: fixed;
      inset: 0 0 40px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #2C3D2E;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #loading.visible { opacity: 0.5; }

    #dev-readout {
      display: none;
      position: fixed;
      top: 16px; left: 16px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #2C3D2E;
      background: rgba(242,240,234,0.85);
      padding: 10px 14px;
      line-height: 1.8;
      pointer-events: none;
    }
    #dev-readout.visible { display: block; }
  </style>
</head>
<body>

  <div id="viewer"></div>
  <div id="loading">Loading</div>

  <div id="footer">
    <span id="hint">Drag to orbit &nbsp;&middot;&nbsp; Scroll to zoom &nbsp;&middot;&nbsp; Right-click to pan</span>
    <button id="reset-btn">Reset view</button>
  </div>

  <div id="dev-readout">
    <div>az &nbsp;&nbsp;<span id="dev-az">—</span>°</div>
    <div>el &nbsp;&nbsp;<span id="dev-el">—</span>°</div>
    <div>zoom &nbsp;<span id="dev-zoom">—</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

  <script>
    /* ── URL params ── */
    const params   = new URLSearchParams(location.search);
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const devMode  = params.get('dev') === '1';

    const lcParam      = params.get('lc');
    const LINE_COLOR   = lcParam ? parseInt(lcParam.replace('#',''), 16) : 0x2C3D2E;
    const uiColor      = lcParam ? `#${lcParam.replace('#','')}` : '#2C3D2E';
    const LINE_OPACITY = 0.55;
    const EDGE_ANGLE   = parseFloat(params.get('ea') || 15);

    if (lcParam) {
      const s = document.createElement('style');
      s.textContent = `
        #hint, #loading, #dev-readout { color: ${uiColor} !important; }
        #reset-btn { color: ${uiColor} !important; border-color: ${uiColor} !important; }
      `;
      document.head.appendChild(s);
    }

    function getParam(mobileKey, desktopKey, fallback) {
      if (isMobile && params.has(mobileKey)) return parseFloat(params.get(mobileKey));
      if (params.has(desktopKey))            return parseFloat(params.get(desktopKey));
      return fallback;
    }

    const CAM_AZ   = getParam('maz',  'az',   45);
    const CAM_EL   = getParam('mel',  'el',   30);
    const CAM_ZOOM = getParam('mzoom','zoom',  1.0);

    /* ── Viewer ── */
    const viewerEl = document.getElementById('viewer');
    function vw() { return viewerEl.clientWidth  || window.innerWidth; }
    function vh() { return viewerEl.clientHeight || (window.innerHeight - 40); }

    /* ── Scene ── */
    const scene = new THREE.Scene();

    /* ── Camera ── */
    const camera = new THREE.PerspectiveCamera(42, vw() / vh(), 0.001, 2000);

    /* ── Renderer ── */
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(vw(), vh());
    renderer.domElement.style.touchAction = 'none';
    viewerEl.appendChild(renderer.domElement);

    /* ── Controls — desktop only ── */
    const MIN_DIST = 0.5;
    const MAX_DIST = 500;
    const lookAt   = new THREE.Vector3(0, 0, 0);

    let controls = null;
    if (!isMobile) {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.autoRotate    = false;
      controls.minDistance   = MIN_DIST;
      controls.maxDistance   = MAX_DIST;
      controls.target.set(0, 0, 0);
    }

    /* ── Mobile touch ── */
    if (isMobile) {
      let prevTouches = null;
      function snap(e) {
        return Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
      }
      renderer.domElement.addEventListener('touchstart', (e) => {
        e.preventDefault(); prevTouches = null;
      }, { passive: false });
      renderer.domElement.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const curr = snap(e);
        if (prevTouches && prevTouches.length === curr.length) {
          if (curr.length === 1) {
            const dx = curr[0].x - prevTouches[0].x;
            const dy = curr[0].y - prevTouches[0].y;
            const offset = camera.position.clone().sub(lookAt);
            const sph    = new THREE.Spherical().setFromVector3(offset);
            sph.theta -= dx * 0.008;
            sph.phi   -= dy * 0.008;
            sph.phi    = Math.max(0.05, Math.min(Math.PI * 0.95, sph.phi));
            camera.position.copy(new THREE.Vector3().setFromSpherical(sph).add(lookAt));
            camera.lookAt(lookAt);
          } else if (curr.length === 2) {
            const prev2 = Math.hypot(prevTouches[1].x - prevTouches[0].x, prevTouches[1].y - prevTouches[0].y);
            const curr2 = Math.hypot(curr[1].x - curr[0].x, curr[1].y - curr[0].y);
            if (curr2 > 0 && prev2 > 0) {
              const offset = camera.position.clone().sub(lookAt);
              const newLen = Math.max(MIN_DIST, Math.min(MAX_DIST, offset.length() * (prev2 / curr2)));
              camera.position.copy(lookAt.clone().add(offset.normalize().multiplyScalar(newLen)));
              camera.lookAt(lookAt);
            }
          }
        }
        prevTouches = curr;
      }, { passive: false });
      renderer.domElement.addEventListener('touchend',    (e) => { e.preventDefault(); prevTouches = null; }, { passive: false });
      renderer.domElement.addEventListener('touchcancel', (e) => { e.preventDefault(); prevTouches = null; }, { passive: false });
    }

    /* ── Light ── */
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    /* ── Silhouette-edge detection ──
       Per-frame detection of smooth edges (cylinder profiles etc) that
       EdgesGeometry skips. One adjacent face front-facing, one back-facing
       = silhouette edge. Precomputed on load, checked every frame.
    ── */
    const silhouetteMeshData = [];
    const MAX_SIL_SEGS = 120000;
    const silBuf = new Float32Array(MAX_SIL_SEGS * 6);
    const silGeo = new THREE.BufferGeometry();
    silGeo.setAttribute('position',
      new THREE.BufferAttribute(silBuf, 3).setUsage(THREE.DynamicDrawUsage));
    silGeo.setDrawRange(0, 0);
    const silLines = new THREE.LineSegments(
      silGeo,
      new THREE.LineBasicMaterial({ color: LINE_COLOR, transparent: true, opacity: LINE_OPACITY })
    );
    silLines.renderOrder   = 1;
    silLines.frustumCulled = false;
    scene.add(silLines);

    /* ── Camera helpers ── */
    let modelScale    = 1;
    let defaultCamPos = new THREE.Vector3();
    let transitioning = false;
    let camTarget     = null;

    function buildCamPos(az, el, zoom, d) {
      const azRad = az * Math.PI / 180;
      const elRad = el * Math.PI / 180;
      const r     = d * 1.4 * zoom;
      return new THREE.Vector3(
        r * Math.cos(elRad) * Math.sin(azRad),
        r * Math.sin(elRad),
        r * Math.cos(elRad) * Math.cos(azRad)
      );
    }

    function resetView() {
      camTarget = defaultCamPos.clone();
      transitioning = true;
    }

    /* ── Dev readout ── */
    if (devMode) document.getElementById('dev-readout').classList.add('visible');

    function updateDevReadout() {
      if (!devMode) return;
      const rel   = camera.position.clone().sub(lookAt);
      const r     = rel.length();
      const elDeg = (Math.asin(rel.y / r) * 180 / Math.PI).toFixed(1);
      const azDeg = (Math.atan2(rel.x, rel.z) * 180 / Math.PI).toFixed(1);
      const zoom  = (r / (modelScale * 1.4)).toFixed(2);
      document.getElementById('dev-az').textContent   = azDeg;
      document.getElementById('dev-el').textContent   = elDeg;
      document.getElementById('dev-zoom').textContent = zoom;
    }

    /* ── Hint text ── */
    document.getElementById('hint').textContent = isMobile
      ? 'Tap to orbit  ·  Pinch to zoom'
      : 'Drag to orbit  ·  Scroll to zoom  ·  Right-click to pan';

    /* ── Silhouette precompute ── */
    function buildSilhouetteData(welded, matrixWorld) {
      const posAttr   = welded.attributes.position;
      const idxArr    = welded.index ? welded.index.array : null;
      const vertCount = posAttr.count;
      const faceCount = idxArr ? idxArr.length / 3 : vertCount / 3;

      const verts = new Float32Array(vertCount * 3);
      const tmp   = new THREE.Vector3();
      for (let i = 0; i < vertCount; i++) {
        tmp.fromBufferAttribute(posAttr, i).applyMatrix4(matrixWorld);
        verts[i*3]   = tmp.x;
        verts[i*3+1] = tmp.y;
        verts[i*3+2] = tmp.z;
      }

      const faceNormals = new Float32Array(faceCount * 3);
      const ab = new THREE.Vector3(), ac = new THREE.Vector3(), fn = new THREE.Vector3();
      const va  = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
      for (let f = 0; f < faceCount; f++) {
        const i0 = idxArr ? idxArr[f*3]   : f*3;
        const i1 = idxArr ? idxArr[f*3+1] : f*3+1;
        const i2 = idxArr ? idxArr[f*3+2] : f*3+2;
        va.set(verts[i0*3], verts[i0*3+1], verts[i0*3+2]);
        vb.set(verts[i1*3], verts[i1*3+1], verts[i1*3+2]);
        vc.set(verts[i2*3], verts[i2*3+1], verts[i2*3+2]);
        ab.subVectors(vb, va);
        ac.subVectors(vc, va);
        fn.crossVectors(ab, ac).normalize();
        faceNormals[f*3]   = fn.x;
        faceNormals[f*3+1] = fn.y;
        faceNormals[f*3+2] = fn.z;
      }

      const cosThreshold = Math.cos(EDGE_ANGLE * Math.PI / 180);
      const edgeMap = new Map();
      for (let f = 0; f < faceCount; f++) {
        for (let e = 0; e < 3; e++) {
          const vi0 = idxArr ? idxArr[f*3 + e]       : f*3 + e;
          const vi1 = idxArr ? idxArr[f*3 + (e+1)%3] : f*3 + (e+1)%3;
          const key = vi0 < vi1 ? `${vi0}_${vi1}` : `${vi1}_${vi0}`;
          if (!edgeMap.has(key)) edgeMap.set(key, { vi0, vi1, faces: [] });
          edgeMap.get(key).faces.push(f);
        }
      }

      const smoothEdges = [];
      const fn0 = new THREE.Vector3(), fn1 = new THREE.Vector3();
      for (const edge of edgeMap.values()) {
        if (edge.faces.length !== 2) continue;
        const f0 = edge.faces[0], f1 = edge.faces[1];
        fn0.set(faceNormals[f0*3], faceNormals[f0*3+1], faceNormals[f0*3+2]);
        fn1.set(faceNormals[f1*3], faceNormals[f1*3+1], faceNormals[f1*3+2]);
        if (fn0.dot(fn1) > cosThreshold) {
          smoothEdges.push({
            p0: [verts[edge.vi0*3], verts[edge.vi0*3+1], verts[edge.vi0*3+2]],
            p1: [verts[edge.vi1*3], verts[edge.vi1*3+1], verts[edge.vi1*3+2]],
            f0, f1
          });
        }
      }

      silhouetteMeshData.push({ faceNormals, smoothEdges });
    }

    function updateSilhouettes() {
      const cx = camera.position.x;
      const cy = camera.position.y;
      const cz = camera.position.z;
      let writeIdx = 0;

      for (const mesh of silhouetteMeshData) {
        const { faceNormals, smoothEdges } = mesh;
        for (const edge of smoothEdges) {
          const mx = (edge.p0[0] + edge.p1[0]) * 0.5;
          const my = (edge.p0[1] + edge.p1[1]) * 0.5;
          const mz = (edge.p0[2] + edge.p1[2]) * 0.5;
          const vx = cx - mx, vy = cy - my, vz = cz - mz;
          const f0 = edge.f0, f1 = edge.f1;
          const d0 = faceNormals[f0*3]*vx + faceNormals[f0*3+1]*vy + faceNormals[f0*3+2]*vz;
          const d1 = faceNormals[f1*3]*vx + faceNormals[f1*3+1]*vy + faceNormals[f1*3+2]*vz;
          if ((d0 > 0) !== (d1 > 0)) {
            if (writeIdx + 6 > MAX_SIL_SEGS * 6) break;
            silBuf[writeIdx++] = edge.p0[0]; silBuf[writeIdx++] = edge.p0[1]; silBuf[writeIdx++] = edge.p0[2];
            silBuf[writeIdx++] = edge.p1[0]; silBuf[writeIdx++] = edge.p1[1]; silBuf[writeIdx++] = edge.p1[2];
          }
        }
      }
      silGeo.attributes.position.needsUpdate = true;
      silGeo.setDrawRange(0, writeIdx / 3);
    }

    /* ── Load GLB ── */
    function loadModel(url) {
      document.getElementById('loading').classList.add('visible');

      new THREE.GLTFLoader().load(url, (gltf) => {
        const root = gltf.scene;

        const box    = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size   = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale  = 4 / maxDim;

        root.position.sub(center.multiplyScalar(scale));
        root.scale.setScalar(scale);
        root.updateMatrixWorld(true);

        silhouetteMeshData.length = 0;

        root.traverse((child) => {
          if (!child.isMesh) return;

          const welded = THREE.BufferGeometryUtils.mergeVertices(child.geometry.clone(), 0.001);
          welded.computeVertexNormals();

          child.material = new THREE.MeshBasicMaterial({
            colorWrite: false, depthWrite: true,
            polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
          });
          child.renderOrder = 0;

          const edges = new THREE.EdgesGeometry(welded, EDGE_ANGLE);
          const lines = new THREE.LineSegments(
            edges,
            new THREE.LineBasicMaterial({ color: LINE_COLOR, transparent: true, opacity: LINE_OPACITY })
          );
          lines.renderOrder = 1;
          child.add(lines);

          buildSilhouetteData(welded, child.matrixWorld);
        });

        scene.add(root);

        const d    = maxDim * scale;
        modelScale = d;

        defaultCamPos = buildCamPos(CAM_AZ, CAM_EL, CAM_ZOOM, d);
        lookAt.set(0, 0, 0);
        if (controls) controls.target.copy(lookAt);
        camera.position.copy(defaultCamPos);
        camera.lookAt(lookAt);
        if (controls) controls.update();

        document.getElementById('loading').classList.remove('visible');
        document.getElementById('footer').classList.add('visible');

      }, undefined, (err) => {
        console.error('GLB load error:', err);
        document.getElementById('loading').classList.remove('visible');
      });
    }

    /* ── Auto-load from ?model=URL ── */
    const autoModel = params.get('model');
    if (autoModel) loadModel(autoModel);

    document.getElementById('reset-btn').addEventListener('click', resetView);
    renderer.domElement.addEventListener('pointerdown', () => { transitioning = false; });

    /* ── Resize ── */
    window.addEventListener('resize', () => {
      camera.aspect = vw() / vh();
      camera.updateProjectionMatrix();
      renderer.setSize(vw(), vh());
    });

    /* ── Loop ── */
    (function animate() {
      requestAnimationFrame(animate);

      if (transitioning && camTarget) {
        camera.position.lerp(camTarget, 0.08);
        if (camera.position.distanceTo(camTarget) < 0.01) {
          camera.position.copy(camTarget);
          transitioning = false;
        }
      }

      if (controls) { controls.update(); }
      else           { camera.lookAt(lookAt); }

      updateSilhouettes();
      updateDevReadout();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
