<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDG — Model View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* Canvas lives here — leaves room for footer */
    #viewer {
      position: absolute;
      top: 0; left: 0; right: 0;
      bottom: 40px;
    }
    #viewer canvas { display: block; }

    /* ── Footer — controls locked to bottom ── */
    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease 0.4s;
    }
    #footer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #hint {
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2C3D2E;
      opacity: 0.4;
      pointer-events: none;
    }

    #reset-btn {
      font-family: inherit;
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 12px;
      border: 1px solid #2C3D2E;
      background: transparent;
      color: #2C3D2E;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.15s;
    }
    #reset-btn:hover { opacity: 1; }


    /* ── Loading ── */
    #loading {
      position: fixed;
      inset: 0 0 40px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #2C3D2E;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #loading.visible { opacity: 0.5; }
  </style>
</head>
<body>

  <div id="viewer"></div>

  <div id="footer">
    <span id="hint">Drag to orbit &nbsp;&middot;&nbsp; Scroll to zoom &nbsp;&middot;&nbsp; Right-click to pan</span>
    <button id="reset-btn">Reset view</button>
  </div>

  <div id="loading">Loading</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const LINE_COLOR = 0x2C3D2E;
    const LINE_OPACITY = 0.55;   // delicate lines
    const EDGE_ANGLE   = 15;     // only meaningful creases

    /* ── Viewer container (canvas fills this, not the full viewport) ── */
    const viewerEl = document.getElementById('viewer');

    function vw() { return viewerEl.clientWidth; }
    function vh() { return viewerEl.clientHeight; }

    /* ── Scene ── */
    const scene = new THREE.Scene();

    /* ── Camera ── */
    const camera = new THREE.PerspectiveCamera(42, vw() / vh(), 0.001, 2000);

    /* ── Renderer ── */
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(vw(), vh());
    viewerEl.appendChild(renderer.domElement);

    /* ── Controls ── */
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping   = true;
    controls.dampingFactor   = 0.06;
    controls.autoRotate      = false;
    controls.minDistance     = 0.5;
    controls.maxDistance     = 500;

    /* ── Light ── */
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    /* ── Default camera position — set after model loads ── */
    let defaultCamPos = new THREE.Vector3();
    let transitioning = false;
    let camTarget     = null;

    function resetView() {
      camTarget     = defaultCamPos.clone();
      transitioning = true;
    }

    /* ── Load GLB ── */
    function loadModel(url) {
      document.getElementById('loading').classList.add('visible');

      new THREE.GLTFLoader().load(url, (gltf) => {
        const root = gltf.scene;

        // Normalize to ~4-unit bounding box
        const box    = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size   = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale  = 4 / maxDim;

        root.position.sub(center.multiplyScalar(scale));
        root.scale.setScalar(scale);

        // Pure linework — invisible occluder + delicate edge lines
        root.traverse((child) => {
          if (!child.isMesh) return;

          child.material = new THREE.MeshBasicMaterial({
            colorWrite:          false,
            depthWrite:          true,
            polygonOffset:       true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits:  1
          });
          child.renderOrder = 0;

          const edges = new THREE.EdgesGeometry(child.geometry, EDGE_ANGLE);
          const lines = new THREE.LineSegments(
            edges,
            new THREE.LineBasicMaterial({
              color:       LINE_COLOR,
              transparent: true,
              opacity:     LINE_OPACITY
            })
          );
          lines.renderOrder = 1;
          child.add(lines);
        });

        scene.add(root);

        // Set curated default camera — ISO angle, slightly elevated
        const d = maxDim * scale;
        const h = size.y * scale;
        defaultCamPos.set(d * 1.1, h * 0.85, d * 1.1);

        controls.target.set(0, 0, 0);
        camera.position.copy(defaultCamPos);
        controls.update();

        document.getElementById('loading').classList.remove('visible');
        document.getElementById('footer').classList.add('visible');

      }, undefined, (err) => {
        console.error('GLB load error:', err);
        document.getElementById('loading').classList.remove('visible');
      });
    }

    /* ── Auto-load from ?model=URL ── */
    const autoModel = new URLSearchParams(location.search).get('model');
    if (autoModel) loadModel(autoModel);


    /* ── Reset button ── */
    document.getElementById('reset-btn').addEventListener('click', resetView);

    /* ── Cancel transition on manual orbit ── */
    renderer.domElement.addEventListener('pointerdown', () => {
      transitioning = false;
    });

    /* ── Resize ── */
    window.addEventListener('resize', () => {
      camera.aspect = vw() / vh();
      camera.updateProjectionMatrix();
      renderer.setSize(vw(), vh());
    });

    /* ── Loop ── */
    (function animate() {
      requestAnimationFrame(animate);

      if (transitioning && camTarget) {
        camera.position.lerp(camTarget, 0.08);
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.08);
        if (camera.position.distanceTo(camTarget) < 0.01) {
          camera.position.copy(camTarget);
          transitioning = false;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
